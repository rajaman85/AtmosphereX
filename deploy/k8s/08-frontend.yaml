apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-frontend
  namespace: atmospherex
  labels:
    app: weather-frontend
    app.kubernetes.io/name: atmospherex
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: weather-frontend
        app.kubernetes.io/name: atmospherex
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: atmospherex-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: weather-frontend
  namespace: atmospherex
  labels:
    app: weather-frontend
    app.kubernetes.io/name: atmospherex
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: weather-frontend
